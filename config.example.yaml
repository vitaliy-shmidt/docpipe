# Copy this file to config.yaml (or point DOCPIPE_CONFIG at your own copy)
# and fill in real values. Never commit the real file.

server:
  # Technical safety limit for uploads. Not a billing/quota limit.
  max_file_size_mb: 25

stirling:
  base_url: "http://stirling:8080"
  api_key: ""
  timeout_seconds: 90

  # Optional OCR fallback for scanned/image-only PDFs - see README.md
  # "Text extraction". Only used when plain text extraction on a PDF comes
  # back with fewer than `min_meaningful_characters` real characters.
  # Omit this whole block entirely for the same defaults shown here.
  ocr:
    enabled: true
    languages: [deu, eng]      # Tesseract language codes; must be installed in Stirling
    min_meaningful_characters: 30
    timeout_seconds: 180       # separate from stirling.timeout_seconds - OCR is much slower

# Optional (V2.1): only needed if at least one client has services.ai: true.
# Provider-wide connection only - no model here. "The client selects the
# task (mode); DocPipe selects the model (model profile)" - see `models:`
# below and README.md "AI analysis" for the full picture.
ollama:
  base_url: "http://ollama:11434"
  # Ollama Keep-Alive tuning pass (see docs/staging-deployment.md "Ollama
  # Keep-Alive"). How long Ollama keeps a model resident in memory after
  # the last request, so a follow-up question doesn't pay the full cold-load
  # cost again. Sent identically on every /api/generate call this process
  # makes (analyze AND assistant - system/services/ollama.py) - not a
  # per-request/per-client setting. Omit this key entirely to fall back to
  # a conservative code default ("5m", see system/config.py
  # DEFAULT_OLLAMA_KEEP_ALIVE) rather than silently jumping to the longer
  # value below. Accepts a positive Go-style duration ("30s"/"5m"/"15m"/
  # "1h") or a plain positive integer number of seconds - never 0 or a
  # negative value (Ollama's own "unload immediately"/"keep forever"
  # meanings - deliberately not offered here, see README "Model profiles").
  # "15m" is the recommended production value for an 8 GB RAM box running
  # a single ~1-2 GB instruct model - long enough to survive normal
  # question-to-question gaps, short enough to still free the RAM during
  # genuinely idle periods. Re-evaluate under real RAM/swap pressure (see
  # docs/staging-deployment.md "RAM awareness") before raising it further.
  keep_alive: "15m"

# Optional (V2.2) - see docs/prompt-lab.md. Omit this whole block entirely
# for the defaults shown here. base_dir is the repo-shipped prompts
# (read-only in production, see docker-compose.yml's `:ro` mount);
# runtime_dir is where the Prompt Lab actually writes saved versions and
# each mode's active-version pointer - point it at a persistent volume in
# production, or leave it as a plain local folder for development (it is
# created automatically on first save).
prompts:
  base_dir: "system/prompts"
  runtime_dir: "runtime-prompts"
  max_content_length: 32000

# Named resource/quality classes, not vendors: `light` is not "Qwen",
# `heavy` is not "Mistral" - the profile name is what modes and client
# overrides reference; only the profile's own `model:` field says which
# actual model backs it, and that can change per environment without
# touching any mode definition. Pick any locally available instruct
# models - DocPipe does not hardcode or require specific ones. `heavy` is
# deliberately provided even though no active mode defaults to it yet
# (see README.md "Model profiles").
models:
  # Timeout tuning pass (task §24/§25): real staging measurements against
  # qwen2.5:1.5b-instruct for assistant modes that default to "light"
  # (maintenance_question/inspection_question/contract_question/
  # general_hotel_question) came in at ~57-58s - uncomfortably close to the
  # previous 60s ceiling (a single slow/cold call could already have hit
  # ai_timeout here, independent of anything on the HubDix side). Bumped to
  # 90s for headroom. Deliberately NOT bumped to match HubDix's 180s
  # assistant HTTP timeout - see "standard" below for why that distinction
  # matters, and README "Model profiles" for how this ceiling relates to a
  # calling client's own timeout.
  light:
    provider: ollama
    model: "your-small-model"
    timeout_seconds: 90
    temperature: 0

  # hotel_health_summary/document_question (the two "standard"-profile
  # assistant modes, see system/assistant/modes.py) share this profile with
  # inspection_extraction. Bumped from 120s to 150s - real staging
  # measurements for hotel_health_summary landed at 28-58s per request, but
  # a cold Ollama load (see "Ollama Keep-Alive" above) can meaningfully add
  # to that. Deliberately kept BELOW HubDix's new 180s assistant HTTP
  # timeout (see hubdix-light's DocumentProcessingClient::assistantQuery()):
  # DocPipe should reach its own timeout and return a clean ai_timeout
  # (504) before HubDix's client-side timeout fires, so a genuinely stuck
  # request still surfaces as a normal, mapped error instead of both sides
  # racing to the same wall-clock cutoff. Not pushed further just to match
  # 180s exactly, and not split into a separate assistant-only profile in
  # this pass - inspection_extraction benefits from the same higher ceiling
  # at essentially no cost (a longer timeout never slows down an already-
  # fast successful call, it only changes how long a stuck one is waited
  # on) - re-visit only if inspection_extraction and hotel_health_summary
  # ever need genuinely different ceilings.
  standard:
    provider: ollama
    model: "your-medium-model"
    timeout_seconds: 150
    temperature: 0

  heavy:
    provider: ollama
    model: "your-large-model"
    timeout_seconds: 180
    temperature: 0

clients:
  demo-client:
    enabled: true
    api_key: "change-me"
    services:
      documents: true
      ai: true
      # Optional (V2.2), both independent opt-ins from `ai` - see
      # docs/prompt-lab.md / docs/assistant-routing.md. A real deployment
      # should normally only grant prompt_lab to an internal/admin client
      # (e.g. HubDix's DocLab), never to an ordinary integration client.
      prompt_lab: true
      assistant: true

    # Optional per-client override: mode name -> model PROFILE name only
    # (never a raw model name). Omit entirely to use each mode's built-in
    # default profile (see system/ai/modes.py). Extraction modes only -
    # assistant modes have no per-client override yet (see
    # docs/assistant-routing.md "Not implemented").
    model_overrides:
      maintenance_extraction: light
      inspection_extraction: standard

# Copy this file to config.yaml (or point DOCPIPE_CONFIG at your own copy)
# and fill in real values. Never commit the real file.

server:
  # Technical safety limit for uploads. Not a billing/quota limit.
  max_file_size_mb: 25

stirling:
  base_url: "http://stirling:8080"
  api_key: ""
  timeout_seconds: 90

  # Optional OCR fallback for scanned/image-only PDFs - see README.md
  # "Text extraction". Only used when plain text extraction on a PDF comes
  # back with fewer than `min_meaningful_characters` real characters.
  # Omit this whole block entirely for the same defaults shown here.
  ocr:
    enabled: true
    languages: [deu, eng]      # Tesseract language codes; must be installed in Stirling
    min_meaningful_characters: 30
    timeout_seconds: 180       # separate from stirling.timeout_seconds - OCR is much slower

# Optional (V2.1): only needed if at least one client has services.ai: true.
# Provider-wide connection only - no model here. "The client selects the
# task (mode); DocPipe selects the model (model profile)" - see `models:`
# below and README.md "AI analysis" for the full picture.
ollama:
  base_url: "http://ollama:11434"

# Optional (V2.2) - see docs/prompt-lab.md. Omit this whole block entirely
# for the defaults shown here. base_dir is the repo-shipped prompts
# (read-only in production, see docker-compose.yml's `:ro` mount);
# runtime_dir is where the Prompt Lab actually writes saved versions and
# each mode's active-version pointer - point it at a persistent volume in
# production, or leave it as a plain local folder for development (it is
# created automatically on first save).
prompts:
  base_dir: "system/prompts"
  runtime_dir: "runtime-prompts"
  max_content_length: 32000

# Named resource/quality classes, not vendors: `light` is not "Qwen",
# `heavy` is not "Mistral" - the profile name is what modes and client
# overrides reference; only the profile's own `model:` field says which
# actual model backs it, and that can change per environment without
# touching any mode definition. Pick any locally available instruct
# models - DocPipe does not hardcode or require specific ones. `heavy` is
# deliberately provided even though no active mode defaults to it yet
# (see README.md "Model profiles").
models:
  light:
    provider: ollama
    model: "your-small-model"
    timeout_seconds: 60
    temperature: 0

  standard:
    provider: ollama
    model: "your-medium-model"
    timeout_seconds: 120
    temperature: 0

  heavy:
    provider: ollama
    model: "your-large-model"
    timeout_seconds: 180
    temperature: 0

clients:
  demo-client:
    enabled: true
    api_key: "change-me"
    services:
      documents: true
      ai: true
      # Optional (V2.2), both independent opt-ins from `ai` - see
      # docs/prompt-lab.md / docs/assistant-routing.md. A real deployment
      # should normally only grant prompt_lab to an internal/admin client
      # (e.g. HubDix's DocLab), never to an ordinary integration client.
      prompt_lab: true
      assistant: true

    # Optional per-client override: mode name -> model PROFILE name only
    # (never a raw model name). Omit entirely to use each mode's built-in
    # default profile (see system/ai/modes.py). Extraction modes only -
    # assistant modes have no per-client override yet (see
    # docs/assistant-routing.md "Not implemented").
    model_overrides:
      maintenance_extraction: light
      inspection_extraction: standard

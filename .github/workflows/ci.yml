name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check system tests

      - name: Test
        run: pytest

  # Real-browser tests of the monitoring dashboard (M4/M5): synthetic data on a
  # local Uvicorn server, no secrets, read-only token. DOCPIPE_REQUIRE_BROWSER
  # turns a missing browser into a failure instead of a skip.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DOCPIPE_REQUIRE_BROWSER: "1"
      DOCPIPE_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-browser.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Browser tests
        run: >-
          pytest -v tests/test_monitor_dashboard_browser.py tests/test_monitor_upstreams_browser.py
          tests/test_monitor_visual_release.py

      - name: Screenshots (synthetic data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitoring-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

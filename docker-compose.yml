# Local convenience setup. DocPipe does not require this file:
# point STIRLING_URL/OLLAMA_URL at any existing instances and run the
# docpipe image (or `uvicorn system.main:app`) on its own.
services:
  docpipe:
    build: .
    ports:
      - "8000:8000"
    environment:
      DOCPIPE_CONFIG: /app/config.yaml
      STIRLING_URL: http://stirling:8080
      # Only relevant if a client in config.yaml has services.ai: true.
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # V2.2 Prompt Lab (see docs/prompt-lab.md): the repo-shipped prompts
      # baked into the image stay read-only (DocPipe never writes into
      # /app/system/prompts - see system/ai/prompt_registry.py). This
      # second, writable volume is where a prompt_lab client's saved
      # versions and each mode's active-version pointer actually persist
      # across a redeploy - without it, a Lab save/activate would still
      # work (files land inside the container) but vanish on the next
      # `docker compose up --build`.
      - ./runtime-prompts:/app/runtime-prompts
    depends_on:
      - stirling

  stirling:
    image: stirlingtools/stirling-pdf:latest
    ports:
      - "8080:8080"

  # Optional (V2.1 AI) - only start this if you actually use the analyze
  # endpoint locally; DocPipe works without it otherwise. Starting this
  # container does NOT download any model - pull one explicitly once with:
  #   docker compose exec ollama ollama pull <model>
  # then reference that same name from a profile's `model:` field under
  # `models:` in config.yaml (see config.example.yaml). For GPU
  # acceleration, add the appropriate `deploy.resources.reservations.devices`
  # block for your platform - not required, CPU inference works, just slower.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
